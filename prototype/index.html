<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="KRISEVA ATTEST research-stage synthetic evidence review prototype.">
    <title>KRISEVA ATTEST · human-reviewed evidence workbench</title>
    <link rel="stylesheet" href="prototype.css">
  </head>
  <body>
    <a class="skip-link" href="#app-screen">Skip to active screen</a>
    <header class="dossier-header">
      <a class="wordmark" href="#dashboard" aria-label="KRISEVA ATTEST case dashboard">
        <img class="brand-logo" src="../assets/kriseva-logo.svg" alt="KRISEVA monogram" width="36" height="36">
        <span>KRISEVA</span>
        <strong>ATTEST</strong>
      </a>
      <p class="product-line">Human-reviewed evidence workbench</p>
      <button class="header-reset" id="header-reset" type="button">Reset demo</button>
    </header>
    <p class="prototype-boundary">RESEARCH-STAGE PROTOTYPE · SYNTHETIC DEMO DATA · NOT A REGULATORY FILING · NO REGULATOR CONNECTION</p>
    <nav class="screen-navigation" aria-label="Prototype screens" id="screen-navigation"></nav>
    <div class="announcement" id="announcement" aria-live="polite" aria-atomic="true"></div>
    <div id="prototype-root" class="prototype-root" aria-busy="true">
      <main class="loading-state"><p>Loading the local synthetic case…</p></main>
    </div>
    <noscript>This local prototype requires JavaScript to replay its deterministic evidence-review state.</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
